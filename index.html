<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons & app icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- user-scalable/maximum-scale are intentionally NOT restricted — disabling
         pinch-zoom blocks low-vision users from zooming the page (WCAG 1.4.4/
         1.4.10). The canvas itself opts out of the browser's own touch gesture
         handling via `touch-action: none` (see Canvas.tsx), so page pinch-zoom
         and the canvas's own pinch-to-zoom-the-drawing don't conflict. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />

    <title>DrawBoard — Free Open-Source Whiteboard</title>
    <meta
      name="description"
      content="A free, open-source, browser-based whiteboard for sketching diagrams and wireframes in a hand-drawn style. No login, no install — just open and draw."
    />
    <link rel="canonical" href="https://draw.designpav.in/" />

    <!-- Open Graph / Twitter Card (static defaults for the app route; docs pages
         set their own per-page values — see src/seo/useHead.ts and scripts/seo-build.ts) -->
    <meta property="og:title" content="DrawBoard — Free Open-Source Whiteboard" />
    <meta
      property="og:description"
      content="A free, open-source, browser-based whiteboard for sketching diagrams and wireframes in a hand-drawn style. No login, no install required."
    />
    <meta property="og:url" content="https://draw.designpav.in/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DrawBoard" />
    <meta property="og:image" content="https://draw.designpav.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DrawBoard — Free Open-Source Whiteboard" />
    <meta
      name="twitter:description"
      content="A free, open-source, browser-based whiteboard for sketching diagrams and wireframes in a hand-drawn style. No login, no install required."
    />
    <meta name="twitter:image" content="https://draw.designpav.in/og-image.png" />

    <!-- Structured data: baked in statically (not just injected by React) so
         crawlers that don't execute JS still see it. Kept in sync with
         src/seo/structuredData.ts — see scripts/seo-build.ts, which regenerates
         this block from that same source at build time. -->
    <script type="application/ld+json" data-jsonld="software-application">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "DrawBoard",
        "description": "A free, open-source, browser-based whiteboard for sketching diagrams and wireframes in a hand-drawn style. No login, no install required.",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Web",
        "url": "https://draw.designpav.in",
        "screenshot": "https://draw.designpav.in/og-image.png",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "license": "https://github.com/krishundre/draw/blob/main/LICENSE",
        "isAccessibleForFree": true
      }
    </script>
    <script type="application/ld+json" data-jsonld="organization">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "DesignPav",
        "url": "https://designpav.in",
        "logo": "https://designpav.in/logo.png",
        "email": "chef@designpav.in",
        "contactPoint": { "@type": "ContactPoint", "email": "chef@designpav.in", "contactType": "customer support" }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <div style="font-family: sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; line-height: 1.6">
        <h1>DrawBoard — a free, open-source, hand-drawn-style whiteboard</h1>
        <p>
          DrawBoard is a free and open-source whiteboard for sketching diagrams, wireframes, and notes with a hand-drawn look. It runs entirely
          in your browser — no account, no login, nothing to install.
        </p>
        <p>This app requires JavaScript to run. Please enable JavaScript, or:</p>
        <ul>
          <li><a href="/docs">Read the user manual</a></li>
          <li><a href="https://github.com/krishundre/draw">View the source code on GitHub (MIT licensed)</a></li>
          <li><a href="mailto:chef@designpav.in">Contact the maintainer</a></li>
        </ul>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
